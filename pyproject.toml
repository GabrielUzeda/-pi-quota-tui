[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notutil"
version = "0.1.0"
description = "Monitor de quotas no terminal com pets pixel-art"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
notutil = "notutil.app:main"

[tool.setuptools.packages.find]
include = ["notutil*"]

[tool.pyright]
include = ["notutil", "pet.py", "quota.py", "tests", "scripts/preview_pet.py"]
extraPaths = ["."]
